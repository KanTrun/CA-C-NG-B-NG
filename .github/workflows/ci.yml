name: ci

on:
  push:
    branches: [main, release/**]
    paths-ignore:
      - "docs/**"
      - "plans/**"
      - "*.md"
      - ".gitignore"
      - "LICENSE"
      - ".github/workflows/deploy-*.yml"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.svg"
      - "**/*.ico"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "plans/**"
      - "*.md"
      - ".gitignore"
      - "LICENSE"
      - ".github/workflows/deploy-*.yml"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.svg"
      - "**/*.ico"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CA_AGENT_MODE: replay

jobs:
  lint-type:
    name: "01 lint + type"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python tools
        run: pip install ruff mypy
      # Cache pip — job chạy mypy cần full dependencies (pydantic, fastapi…). Việc
      # này KHÔNG mang tính tuỳ tiện: khi thiếu pydantic, `BaseModel` resolve
      # thành Any và mypy strict bão `Class cannot subclass "BaseModel" (has
      # type Any)` hàng loạt (đã đỏ run 36100604919) — không phải lỗi code mà
      # là môi trường gate thiếu deps. Giữ đôi với job 02 unit (cùng cấu trúc key).
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ runner.os }}-${{ hashFiles('apps/api/pyproject.toml', 'packages/*/pyproject.toml') }}
          restore-keys: pip-lint-${{ runner.os }}-
      # Cài workspaceEditable: mypy cần nhìn thấy pydantic/FastAPI/ortools thật
      # của repo (giống môi trường dev) chứ không chỉ stub trần.
      - name: Install workspace (cho mypy type-đúng)
        run: |
          pip install -e ./packages/contracts -e ./packages/solver -e ./packages/agents \
            -e ./packages/gates -e ./packages/opsengine -e ./packages/playbook -e ./apps/api
      - name: Ruff
        run: ruff check apps/api/src packages scripts
      # Mypy theo config gốc pyproject.toml: strict = true.
      # Trước đây `|| true` nuốt MỌI lỗi type — gate type check là GIẢ: 65 lỗi
      # strict đang tồn tại (hầu hết file test/contracts cũ trên main) không
      # ai thấy. Chia 2 tầng, theo hướng fail-closed từng bước:
      #   1) MÃ NGUỒN (apps/api/src + packages/*/src): strict, ĐỎ khi có lỗi —
      #      code chạy production không được phép lệch type.
      #   2) TESTS: hiện tạm pass vì nợ cũ của main (đếm in ra để theo dõi);
      #      khi hết nợ sẽ siết ĐỎ tương tự. KHÔNG nuốt im lặng như trước.
      - name: Mypy strict — mã nguồn (gate ĐỎ)
        run: mypy apps/api/src packages/*/src
      - name: Mypy tests — hiện trạng (chưa gate, in số nợ)
        run: |
          errs=$(mypy packages apps/api/src apps/api/tests --ignore-missing-imports 2>&1 | grep -c "error:" || true)
          echo "mypy tests: $errs lỗi (nợ cũ từ main — mục tiêu siết về 0 rồi gate)"
          if [ "$errs" -gt 0 ]; then echo "::warning::mypy tests còn $errs lỗi"; fi
      - name: ESLint / tsc (web)
        working-directory: apps/web
        run: |
          if [ -f package.json ]; then npm install && npm run lint && npm run typecheck; else echo "web stub"; fi

  unit:
    name: "02 unit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-unit-${{ runner.os }}-${{ hashFiles('apps/api/pyproject.toml', 'packages/*/pyproject.toml') }}
          restore-keys: pip-unit-${{ runner.os }}-
      - name: Install workspace
        run: |
          pip install -e ./packages/contracts -e ./packages/solver -e ./packages/agents -e ./packages/gates -e ./packages/opsengine -e ./packages/playbook -e ./apps/api pytest pytest-xdist httpx pyyaml ortools hypothesis
      # Chạy song song với -n auto (pytest-xdist): ~23min → ~2min
      # Bao gồm luôn test_architecture.py và test_no_network.py (trước đây là job 04 và 10 riêng)
      - run: CA_AGENT_MODE=replay pytest -q -n auto
      - name: Export contracts
        run: python scripts/export_contracts.py

  # Job "03 integration" đã XOÁ (2026-09-25): nó chạy `pytest -q
  # apps/api/tests/integration || true` nhưng thư mục đó CHƯA BAO GIỜ tồn tại
  # trong repo (kể từ fdf0a34 16/09 tái cấu trúc job). `|| true` khiến job
  # vẫn "success" dù chẳng test gì — một cổng GIẢ: tốn runner mỗi push và che
  # mắt người đọc về độ phủ test (vi phạm fail-closed ADR-008). Khi nào có
  # test integration thật: tạo `apps/api/tests/integration/`, khôi phục khối
  # job này kèm Postgres/Redis services và BỎ `|| true` (nếu thư mục rỗng
  # phải ĐỎ để lộ ngay, không được im lặng xanh).
  # Các test Postgres/Redis thật hiện diện trong job 02 unit (pytest -n auto
  # từ root, testpaths apps+packages) — đổi DB qua env của fixture riêng.

  solver-bench:
    name: "05 solver bench"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install solver + deps
        run: |
          python -m pip install -e ./packages/contracts -e ./packages/solver \
            -e ./packages/gates -e ./packages/playbook pyyaml ortools
      - name: Solve + independent verify
        run: |
          python scripts/solve_tuan.py
          python scripts/verify_hard.py

  agent-eval:
    name: "06 agent eval"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce replay mode (no live LLM)
        run: |
          test "$CA_AGENT_MODE" = "replay"
      - name: Install agents + eval
        run: |
          python -m pip install -e ./packages/agents -e ./packages/contracts
          CA_AGENT_MODE=replay python scripts/eval_ag_tkb.py
          CA_AGENT_MODE=replay python scripts/eval_ag_msg.py


  e2e:
    name: "08 e2e"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Cache pip packages — tránh tải lại ortools/uvicorn (~60s)
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-e2e-${{ runner.os }}-${{ hashFiles('apps/api/pyproject.toml', 'packages/*/pyproject.toml') }}
          restore-keys: pip-e2e-${{ runner.os }}-

      # Cache node_modules — tránh npm ci mỗi lần (~60s)
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: apps/web/node_modules
          key: npm-e2e-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: npm-e2e-${{ runner.os }}-

      # Cache Playwright browser (Chromium) — lớn nhất, ~90s nếu không cache
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      # Cache Next.js incremental build (.next/cache) — giảm build từ ~3min xuống ~1min
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-${{ hashFiles('apps/web/src/**/*.ts', 'apps/web/src/**/*.tsx') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-

      - name: Install API + Playwright
        run: |
          pip install -e ./packages/contracts -e ./packages/solver -e ./packages/agents -e ./packages/gates -e ./packages/opsengine -e ./packages/playbook -e ./apps/api httpx pyyaml ortools uvicorn
          cd apps/web && npm ci && for attempt in 1 2 3; do npx playwright install --with-deps chromium && exit 0; rm -rf "$HOME/.cache/ms-playwright"; done; exit 1
      - name: Build Next.js
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000"
        run: npm run build
      # Bước copy `static`/`public` vào `.next/standalone` nằm trong
      # `apps/web/scripts/prepare-standalone.mjs` và được playwright.config gọi
      # tự động trước khi start server. Gom về một nguồn để CI và máy dev chạy
      # CÙNG một đường — trước đây chỉ CI copy, nên lỗi thiếu asset không bao giờ
      # tái hiện được ở local (mà hậu quả là toàn bộ e2e đỏ ở bước login).
      - name: Playwright e2e tests
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000"
          NHIPQUAN_DISABLE_RATE_LIMIT: "true"
        run: npm run test:e2e

  docker:
    name: "09 docker build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: |
          cp .env.example .env || touch .env
          sed -i 's/^NHIPQUAN_SEED_DEMO=.*/NHIPQUAN_SEED_DEMO=true/' .env
      - run: docker compose -f infra/docker/compose.yml build
      - name: Stack lên và smoke toàn tuyến
        run: |
          docker compose -f infra/docker/compose.yml up -d --wait || docker compose -f infra/docker/compose.yml up -d
          docker compose -f infra/docker/compose.yml exec -T api python /app/scripts/smoke_docker.py
      - name: Log khi đỏ
        if: failure()
        run: docker compose -f infra/docker/compose.yml logs --tail=200
      - name: Dọn
        if: always()
        run: docker compose -f infra/docker/compose.yml down -v


  yaml-templates:
    name: "11 yaml templates"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/validate_templates.py

  skills-verify:
    name: "12 skills verify (Repo-To-Skill)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -e ./packages/contracts -e ./packages/solver \
            -e ./packages/gates -e ./packages/playbook -e ./packages/agents \
            -e ./apps/api pyyaml ortools
      - name: Verify all 13 Repo Skills fail-closed
        run: |
          python scripts/distill_project_skills.py --verify-only

