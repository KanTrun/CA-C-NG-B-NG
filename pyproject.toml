[project]
name = "nhip-quan"
version = "0.1.0"
description = "NHIP QUAN — cafe shift OS with living playbook"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/api", "packages/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042", "B008", "UP017"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disable_error_code = ["redundant-cast"]

[tool.pytest.ini_options]
testpaths = ["apps", "packages"]
markers = [
    "slow: test tốn CPU/thời gian (solver CP-SAT, hypothesis, sleep wall-clock) — chạy ở job unit-slow, PR fast bỏ qua",
]
pythonpath = ["apps/api/src", "apps/api/tests", "packages/contracts/src", "packages/agents/src", "packages/gates/src", "packages/solver/src", "packages/opsengine/src", "packages/playbook/src"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]
