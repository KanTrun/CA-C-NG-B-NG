services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nhipquan
      POSTGRES_PASSWORD: nhipquan
      POSTGRES_DB: nhipquan
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhipquan"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - nhipquan_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://nhipquan:nhipquan@postgres:5432/nhipquan
      REDIS_URL: redis://redis:6379/0

      CA_AGENT_MODE: ${CA_AGENT_MODE:-replay}
      GEMINI_LIVE_VOICE_ENABLED: ${GEMINI_LIVE_VOICE_ENABLED:-true}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      BAI_API_KEY: ${BAI_API_KEY:-}
      BAI_BASE_URL: ${BAI_BASE_URL:-https://api.b.ai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_TRANSCRIBE_MODEL: ${GEMINI_TRANSCRIBE_MODEL:-gemini-3.5-transcribe}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-20b:free}
      BAI_MODEL: ${BAI_MODEL:-qwen3.8-flash}

      NHIPQUAN_MSG_BACKEND: ${NHIPQUAN_MSG_BACKEND:-console}
      NHIPQUAN_TELEGRAM_BOT_TOKEN: ${NHIPQUAN_TELEGRAM_BOT_TOKEN:-}
      NHIPQUAN_TELEGRAM_WEBHOOK_SECRET: ${NHIPQUAN_TELEGRAM_WEBHOOK_SECRET:-}
      NHIPQUAN_ZALO_ENABLED: ${NHIPQUAN_ZALO_ENABLED:-}
      NHIPQUAN_ZALO_OA_ACCESS_TOKEN: ${NHIPQUAN_ZALO_OA_ACCESS_TOKEN:-}
      NHIPQUAN_FB_PAGE_TOKEN: ${NHIPQUAN_FB_PAGE_TOKEN:-}
      NHIPQUAN_FB_APP_SECRET: ${NHIPQUAN_FB_APP_SECRET:-}
      NHIPQUAN_FB_PAGE_ID: ${NHIPQUAN_FB_PAGE_ID:-}
      NHIPQUAN_PAGE_MODE: ${NHIPQUAN_PAGE_MODE:-replay}
      NHIPQUAN_FB_AUTO_SEND: ${NHIPQUAN_FB_AUTO_SEND:-0}
      NHIPQUAN_FB_WEBHOOK_VERIFY: ${NHIPQUAN_FB_WEBHOOK_VERIFY:-}
      NHIPQUAN_SEED_DEMO: ${NHIPQUAN_SEED_DEMO:-false}
    command: ["sh", "-c", "cd /app/apps/api && alembic -c alembic/alembic.ini upgrade head && uvicorn ca_api.interfaces.http.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    volumes:
      - nhipquan_var:/app/var
      - nhipquan_uploads:/app/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: ["python", "-m", "ca_api.worker"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://nhipquan:nhipquan@postgres:5432/nhipquan
      REDIS_URL: redis://redis:6379/0

      CA_AGENT_MODE: ${CA_AGENT_MODE:-replay}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      BAI_API_KEY: ${BAI_API_KEY:-}
      BAI_BASE_URL: ${BAI_BASE_URL:-https://api.b.ai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_TRANSCRIBE_MODEL: ${GEMINI_TRANSCRIBE_MODEL:-gemini-3.5-transcribe}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-20b:free}
      BAI_MODEL: ${BAI_MODEL:-qwen3.8-flash}

      NHIPQUAN_MSG_BACKEND: ${NHIPQUAN_MSG_BACKEND:-console}
      NHIPQUAN_TELEGRAM_BOT_TOKEN: ${NHIPQUAN_TELEGRAM_BOT_TOKEN:-}
      NHIPQUAN_TELEGRAM_WEBHOOK_SECRET: ${NHIPQUAN_TELEGRAM_WEBHOOK_SECRET:-}
      NHIPQUAN_ZALO_ENABLED: ${NHIPQUAN_ZALO_ENABLED:-}
      NHIPQUAN_ZALO_OA_ACCESS_TOKEN: ${NHIPQUAN_ZALO_OA_ACCESS_TOKEN:-}
      NHIPQUAN_FB_PAGE_TOKEN: ${NHIPQUAN_FB_PAGE_TOKEN:-}
      NHIPQUAN_FB_APP_SECRET: ${NHIPQUAN_FB_APP_SECRET:-}
      NHIPQUAN_FB_PAGE_ID: ${NHIPQUAN_FB_PAGE_ID:-}
      NHIPQUAN_PAGE_MODE: ${NHIPQUAN_PAGE_MODE:-replay}
      NHIPQUAN_FB_AUTO_SEND: ${NHIPQUAN_FB_AUTO_SEND:-0}
      NHIPQUAN_FB_WEBHOOK_VERIFY: ${NHIPQUAN_FB_WEBHOOK_VERIFY:-}
      NHIPQUAN_SEED_DEMO: ${NHIPQUAN_SEED_DEMO:-false}
    volumes:
      - nhipquan_var:/app/var
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_GEMINI_LIVE_VOICE_ENABLED: ${GEMINI_LIVE_VOICE_ENABLED:-true}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  nhipquan_pg:
  nhipquan_var:
  nhipquan_uploads:
